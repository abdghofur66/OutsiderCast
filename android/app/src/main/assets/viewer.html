<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>OutsiderCast — Tonton layar</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0f172a;color:#e2e8f0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#join{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.box{background:#111c33;border:1px solid #1e293b;border-radius:16px;padding:24px;width:min(380px,100%)}
h1{margin:0 0 4px;font-size:22px}h1 span{color:#38bdf8}
p{color:#94a3b8;margin:0 0 16px;font-size:14px}
label{font-size:13px;color:#cbd5e1;display:block;margin:10px 0 4px}
input{width:100%;font:inherit;padding:11px 12px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:#e2e8f0}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:12px;background:#0284c7;color:#fff;width:100%;margin-top:16px;font-weight:600}
#err{color:#fca5a5;font-size:13px;min-height:18px;margin-top:8px}
footer{text-align:center;padding:14px;font-size:13px}
footer .dev{color:#94a3b8}
footer a{color:#e2e8f0;text-decoration:none;display:inline-flex;align-items:center;gap:5px;margin-left:4px}
footer a:hover{color:#38bdf8;text-decoration:none}
footer img{width:18px;height:18px}
#watch{position:fixed;inset:0;background:#000;display:none;overflow:hidden;touch-action:none}
#watch.on{display:block}
#v{position:absolute;left:50%;top:50%;width:100%;height:100%;object-fit:contain;transform-origin:center;transform:translate(-50%,-50%);user-select:none;-webkit-user-drag:none}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;color:#cbd5e1;font-size:17px;background:#0f172a}
#msg[hidden]{display:none}
#vj{position:absolute;left:50%;top:50%;max-width:100%;max-height:100%;transform:translate(-50%,-50%)}
#diag{position:absolute;left:8px;bottom:8px;font:11px ui-monospace,monospace;color:#94a3b8;background:#0008;padding:3px 6px;border-radius:6px;z-index:3;pointer-events:none}
#bar{position:absolute;right:12px;bottom:12px;display:flex;gap:8px;transition:opacity .3s;z-index:2}
#bar.hide{opacity:0;pointer-events:none}
#bar button{width:auto;margin:0;padding:10px 14px;background:#1e293bdd;border:1px solid #334155;font-weight:400}
</style>
</head>
<body>
<div id="join">
  <div class="box">
    <h1>Outsider<span>Cast</span></h1>
    <p>Tonton layar HP yang sedang dibagikan di jaringan ini.</p>
    <label for="name">Nama</label>
    <input id="name" maxlength="40" placeholder="Nama Anda">
    <div id="pinWrap" hidden><label for="pin">PIN ruang</label><input id="pin" inputmode="numeric" maxlength="6" placeholder="PIN dari pemateri"></div>
    <button id="go">Gabung & tonton</button>
    <div id="err"></div>
  </div>
  <footer>
    <span class="dev">Developed by</span>
    <a href="https://outsiderdev.com" target="_blank" rel="noopener"><img src="https://outsiderdev.com/img/ico.png" alt=""> <b>OutsiderDev</b></a>
  </footer>
</div>

<div id="watch">
  <video id="v" autoplay playsinline muted></video>
  <img id="vj" alt="" hidden>
  <div id="msg">Menyambungkan…</div>
  <div id="diag"></div>
  <div id="bar">
    <button id="zout">−</button><button id="zin">+</button>
    <button id="fs">⛶ Layar penuh</button>
    <button id="leave">Keluar</button>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
let watching = false, st = {};
try { $('#name').value = localStorage.getItem('oc-name') || ''; } catch {}

async function status() {
  try { st = await (await fetch('/status', { cache: 'no-store' })).json(); } catch { st = { lost: true }; }
  return st;
}
status().then(s => { if (s.pin) $('#pinWrap').hidden = false; });

$('#go').onclick = async () => {
  $('#err').textContent = '';
  const s = await status();
  if (s.pin) {
    $('#pinWrap').hidden = false;
    const r = await fetch('/auth?pin=' + encodeURIComponent($('#pin').value.trim()));
    if (!r.ok) { $('#err').textContent = 'PIN salah'; return; }
  }
  try { localStorage.setItem('oc-name', $('#name').value.trim()); } catch {}
  $('#join').style.display = 'none'; $('#watch').classList.add('on'); watching = true;
  loop();
};
$('#name').onkeydown = $('#pin').onkeydown = e => e.key === 'Enter' && $('#go').click();

let pc = null, connecting = false, fails = 0, mjpeg = false, ansIps = '', dbg = '';
fetch('/debug').then(r => r.text()).then(t => dbg = t).catch(() => {});
function useMjpeg() {
  if (mjpeg) return; mjpeg = true;
  try { pc && pc.close(); } catch {} pc = null;
  $('#v').hidden = true; const im = $('#vj'); im.hidden = false;
  const pin = encodeURIComponent($('#pin').value.trim());
  const next = () => { if (watching) im.src = '/frame.jpg?pin=' + pin + '&t=' + Date.now(); };
  im.onload = () => setTimeout(next, 60);
  im.onerror = () => setTimeout(next, 400);
  next();
}
function failed() { fails++; if (fails >= 2) useMjpeg(); else if (watching) setTimeout(startStream, 1500); }
async function startStream() {
  if (connecting || mjpeg) return; connecting = true;
  try {
    if (pc) pc.close();
    pc = new RTCPeerConnection({ iceServers: [] });
    pc.addTransceiver('video', { direction: 'recvonly' });
    pc.ontrack = e => { $('#v').srcObject = e.streams[0] || new MediaStream([e.track]); $('#v').play().catch(() => {}); };
    const me = pc; const guard = setTimeout(() => { if (me === pc && pc.connectionState !== 'connected') failed(); }, 9000);
    pc.onconnectionstatechange = () => { if (me !== pc) return; if (pc.connectionState === 'connected') { clearTimeout(guard); fails = 0; } if (pc.connectionState === 'failed') { clearTimeout(guard); failed(); } };
    await pc.setLocalDescription(await pc.createOffer());
    await new Promise(r => { if (pc.iceGatheringState === 'complete') return r(); pc.onicegatheringstatechange = () => pc.iceGatheringState === 'complete' && r(); setTimeout(r, 2500); });
    const res = await fetch('/offer', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sdp: pc.localDescription.sdp, pin: $('#pin').value.trim(), name: $('#name').value.trim() || 'Penonton' }) });
    if (!res.ok) throw new Error(res.status);
    const ans = await res.json();
    ansIps = [...new Set((ans.sdp.match(/a=candidate:\S+ \d \S+ \d+ (\S+) \d+/g) || []).map(l => l.split(' ')[4]))].join(',');
    await pc.setRemoteDescription(ans);
  } catch (e) { if (watching) setTimeout(() => { connecting = false; startStream(); }, 2500); return; }
  connecting = false;
}

async function loop() {
  while (watching) {
    const was = st.live;
    const s = await status();
    const m = $('#msg');
    if (s.lost) { m.hidden = false; m.textContent = 'Koneksi terputus, mencoba menyambung ulang…'; }
    else if (!s.live) { m.hidden = false; m.textContent = 'Menunggu pemateri mulai berbagi layar…'; }
    else if (s.paused) { m.hidden = false; m.textContent = '⏸ Pemateri sedang menjeda layar'; }
    else { m.hidden = true; if (!mjpeg && (!was || !pc)) startStream(); }
    await new Promise(r => setTimeout(r, 1500));
  }
}

$('#leave').onclick = () => location.reload();
$('#fs').onclick = () => {
  const el = $('#watch');
  if (document.fullscreenElement) document.exitFullscreen();
  else if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
  else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
};

// Zoom & geser
let z = 1, x = 0, y = 0;
const apply = () => { const t = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) scale(${z})`; $('#v').style.transform = t; $('#vj').style.transform = t; };
const zoom = f => { z = Math.min(5, Math.max(1, z * f)); if (z === 1) x = y = 0; apply(); };
$('#zin').onclick = () => zoom(1.25); $('#zout').onclick = () => zoom(0.8);
$('#watch').addEventListener('wheel', e => { e.preventDefault(); zoom(e.deltaY < 0 ? 1.1 : 0.9); }, { passive: false });
const pts = new Map(); let lastDist = 0;
$('#watch').addEventListener('pointerdown', e => { if (e.target.closest('#bar')) return; pts.set(e.pointerId, e); });
$('#watch').addEventListener('pointermove', e => {
  if (!pts.has(e.pointerId)) return;
  const prev = pts.get(e.pointerId); pts.set(e.pointerId, e);
  if (pts.size === 2) {
    const [a, b] = [...pts.values()]; const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    if (lastDist) zoom(d / lastDist); lastDist = d;
  } else if (z > 1) { x += e.clientX - prev.clientX; y += e.clientY - prev.clientY; apply(); }
});
['pointerup', 'pointercancel', 'pointerleave'].forEach(t => $('#watch').addEventListener(t, e => { pts.delete(e.pointerId); lastDist = 0; }));
$('#watch').addEventListener('dblclick', () => { z = 1; x = y = 0; apply(); });

// Info diagnosis kecil di pojok kiri bawah (koneksi, codec, resolusi, frame)
setInterval(async () => {
  if (mjpeg) { $('#diag').textContent = 'mode cadangan (MJPEG) · ' + dbg + ' · kandidat HP: ' + (ansIps || '-'); return; }
  if (!pc) return;
  let codec = '', fr = 0, w = 0, h = 0, kb = 0;
  try {
    const st = await pc.getStats();
    st.forEach(r => {
      if (r.type === 'inbound-rtp' && r.kind === 'video') { fr = r.framesDecoded || 0; w = r.frameWidth || 0; h = r.frameHeight || 0; kb = Math.round((r.bytesReceived || 0) / 1024); codec = r.codecId; }
    });
    if (codec && st.get(codec)) codec = st.get(codec).mimeType.replace('video/', '');
  } catch {}
  $('#diag').textContent = `${pc.connectionState} · ${codec || '-'} · ${w}x${h} · frame ${fr} · ${kb} KB · kandidat HP: ${ansIps || '-'} · ${dbg}`;
}, 1000);

let hideT; const wake = () => { $('#bar').classList.remove('hide'); clearTimeout(hideT); hideT = setTimeout(() => $('#bar').classList.add('hide'), 3000); };
['pointermove', 'pointerdown', 'keydown'].forEach(t => document.addEventListener(t, wake)); wake();
</script>
</body>
</html>
